<style>
  :root {
    --brand:#0b5d3b; --brand-soft:#e8f5ee; --brand-ink:#074027;
    --ink:#1c1c1c; --muted:#5a5a5a; --line:rgba(0,0,0,.08);
    --danger:#b00020; --danger-soft:#fdecef; --ok:#1b7f3b;
    --radius:14px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#f2f2f2; --muted:#b8b8b8; --line:rgba(255,255,255,.14);
            --brand-soft:rgba(11,93,59,.25); --danger-soft:rgba(176,0,32,.22); }
    body { background:#101418; color:var(--ink); }
    .card, .ngo-card, .scheme-card, .sign-block { background:#171c21; }
    header { background:#171c21; }
  }
  *,*::before,*::after { box-sizing:border-box; }
  html,body { margin:0; }
  body { font-family:var(--font); color:var(--ink); background:#f7f8f7; line-height:1.5;
         padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right); }
  a { color:var(--brand); }
  a:focus-visible, button:focus-visible, input:focus-visible {
    outline:3px solid #4c9aff; outline-offset:2px; border-radius:6px; }
  img { max-width:100%; }

  /* ---- Header ---- */
  header { position:sticky; top:0; z-index:20; background:#fff;
           border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top); }
  header .bar { max-width:960px; margin:0 auto; min-height:64px; padding:.5rem 1rem;
                display:flex; align-items:center; justify-content:space-between; gap:.75rem; }
  .brand { display:flex; align-items:center; gap:.6rem; min-width:0;
           text-decoration:none; color:inherit; }
  .brand img, .brand .logo {
    width:40px; height:40px; flex:0 0 40px;
    object-fit:contain; border-radius:8px; background:#fff;
    padding:2px; box-shadow:0 1px 3px rgba(0,0,0,.08);
  }
  @media (min-width:480px) {
    .brand img, .brand .logo { width:48px; height:48px; flex-basis:48px; }
  }
  .brand span { display:flex; flex-direction:column; min-width:0;
                font-weight:700; font-size:1rem; line-height:1.15;
                white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .brand small { font-weight:400; font-size:.75rem; color:var(--muted);
                 white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .langs { display:flex; gap:.35rem; flex:0 0 auto; }
  .langs button { min-width:40px; min-height:36px; padding:.35rem .6rem;
                  border:1px solid var(--line); background:transparent; color:inherit;
                  border-radius:999px; font:inherit; font-size:.85rem; cursor:pointer; }
  .langs button.active { background:var(--brand); color:#fff; border-color:var(--brand); }

  /* ---- Layout ---- */
  .wrap { max-width:760px; margin:0 auto; padding:1.25rem 1rem 2.5rem; }
  .card { background:#fff; border:1px solid var(--line); border-radius:var(--radius);
          padding:1.5rem 1.25rem; box-shadow:0 2px 10px rgba(0,0,0,.04); }
  @media (max-width:420px) { .card { padding:1.1rem 1rem; border-radius:12px; } }

  /* ---- Mark ---- */
  .mark { display:inline-flex; align-items:center; justify-content:center;
          width:56px; height:56px; border-radius:50%; font-size:1.7rem; font-weight:700;
          background:var(--brand-soft); color:var(--brand); margin-bottom:.5rem; }
  .mark.valid   { background:var(--brand-soft); color:var(--ok); }
  .mark.invalid { background:var(--danger-soft); color:var(--danger); }
  .mark.loading::after { content:""; width:22px; height:22px; border:3px solid var(--brand);
          border-right-color:transparent; border-radius:50%;
          animation:spin .8s linear infinite; display:block; }
  .mark.loading { font-size:0; }
  @keyframes spin { to { transform:rotate(360deg); } }

  #title { font-size:1.4rem; margin:.25rem 0 .35rem; line-height:1.25; }
  .lead  { color:var(--muted); margin:0 0 .75rem; }

  .badge { display:inline-block; background:var(--brand-soft); color:var(--ok);
           border:1px solid rgba(27,127,59,.25); padding:.25rem .7rem;
           border-radius:999px; font-size:.85rem; font-weight:600; margin-bottom:.5rem; }
  .badge[hidden] { display:none; }

  /* ---- NGO Card (redesigned) ---- */
  .ngo-card {
    background:#fff; border:1px solid var(--line); border-radius:12px;
    padding:1rem 1.1rem; margin:.75rem 0;
    position:relative; overflow:hidden;
  }
  .ngo-card::before {
    content:""; position:absolute; inset:0 auto 0 0; width:4px; background:var(--brand);
  }
  .ngo-header {
    display:flex; gap:.85rem; align-items:center;
    padding-bottom:.75rem; margin-bottom:.75rem;
    border-bottom:1px solid var(--line);
  }
  .ngo-logo {
    width:56px; height:56px; flex:0 0 56px;
    object-fit:contain; border-radius:10px;
    background:#fff; border:1px solid var(--line); padding:4px;
  }
  .ngo-headinfo { min-width:0; flex:1; }
  .ngo-name {
    font-weight:700; font-size:1.05rem; margin:0;
    display:flex; align-items:center; gap:.4rem; flex-wrap:wrap;
  }
  .ngo-verified {
    display:inline-flex; align-items:center; gap:.2rem;
    background:var(--brand-soft); color:var(--ok);
    font-size:.7rem; font-weight:700; padding:.1rem .45rem;
    border-radius:999px; border:1px solid rgba(27,127,59,.3);
  }
  .ngo-tagline {
    font-size:.8rem; color:var(--muted); margin:.15rem 0 0;
  }
  .ngo-tagline[hidden] { display:none; }

  .ngo-grid {
    display:grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap:.5rem .9rem;
  }
  @media (max-width: 560px) {
    .ngo-grid { grid-template-columns: 1fr; }
  }
  .ngo-item {
    display:flex; flex-direction:column; gap:.05rem;
    padding:.35rem 0; min-width:0;
  }
  .ngo-item .k {
    font-size:.7rem; font-weight:600; text-transform:uppercase;
    letter-spacing:.03em; color:var(--muted);
  }
  .ngo-item .v {
    font-size:.86rem; color:var(--ink); font-weight:500;
    word-break:break-word; line-height:1.35;
  }
  .ngo-item .v a { color:var(--brand); text-decoration:none; }
  .ngo-item .v a:hover { text-decoration:underline; }
  .ngo-item.full { grid-column: 1 / -1; }

  /* ---- Scheme Card ---- */
  .scheme-card {
    background:#fff; border:1px solid var(--line); border-radius:12px;
    padding:.9rem 1rem; margin:.75rem 0;
  }
  .scheme-head { display:flex; align-items:center; gap:.5rem; margin-bottom:.5rem; }
  .scheme-icon { width:32px; height:32px; flex:0 0 32px; object-fit:contain;
                 border-radius:8px; background:var(--brand-soft); padding:4px; }
  .scheme-title { font-weight:700; font-size:.98rem; margin:0; }
  .scheme-code { font-size:.72rem; color:var(--muted);
                 background:var(--brand-soft); padding:.05rem .4rem; border-radius:6px; }
  .scheme-desc { font-size:.85rem; color:var(--muted); margin:.25rem 0 .5rem; }
  .scheme-stats { display:flex; justify-content:space-between;
                  font-size:.78rem; color:var(--muted); margin-bottom:.25rem; }
  .progress { height:8px; background:var(--brand-soft); border-radius:999px; overflow:hidden; }
  .progress-bar { height:100%; background:var(--brand); width:0; transition:width .6s ease; }
  .scheme-status { display:inline-block; font-size:.7rem; font-weight:700;
                   padding:.1rem .45rem; border-radius:999px; margin-left:.3rem; }
  .scheme-status.active { background:var(--brand-soft); color:var(--ok); }
  .scheme-status.closed { background:var(--danger-soft); color:var(--danger); }

  /* ---- Details ---- */
  .details { margin:.75rem 0; }
  .details .row { display:flex; gap:.75rem; padding:.5rem 0; border-bottom:1px solid var(--line); }
  .details .row:last-child { border-bottom:0; }
  .details .label { font-weight:600; min-width:8.5rem; color:var(--muted); }
  .details .value { word-break:break-word; display:flex; align-items:center; gap:.4rem; flex-wrap:wrap; }
  @media (max-width:480px) {
    .details .row { flex-direction:column; gap:.1rem; padding:.45rem 0; }
    .details .label { min-width:0; font-size:.8rem; text-transform:uppercase; letter-spacing:.02em; }
  }
  .copy-btn { border:1px solid var(--line); background:transparent; color:inherit;
              border-radius:8px; padding:.15rem .4rem; font-size:.75rem; cursor:pointer; }
  .copy-btn:hover { background:var(--brand-soft); }

  .private { font-size:.9rem; font-style:italic; color:var(--muted);
             background:var(--brand-soft); padding:.6rem .75rem;
             border-radius:10px; margin:.5rem 0; }
  .status { min-height:1.25em; margin:.5rem 0 0; font-size:.9rem; color:var(--danger); }
  .status:empty { min-height:0; }

  /* ---- Signature block ---- */
  .sign-block {
    margin-top:1rem; padding:.85rem 1rem;
    border:1px dashed var(--line); border-radius:12px;
    display:flex; gap:.9rem; align-items:center;
  }
  .sign-img { width:96px; height:48px; object-fit:contain; }
  .sign-info { font-size:.8rem; color:var(--muted); }
  .sign-info b { display:block; color:var(--ink); font-size:.9rem; }

  /* ---- Buttons / forms ---- */
  .actions { margin-top:1rem; display:flex; flex-wrap:wrap; gap:.6rem; }
  .btn { display:inline-flex; align-items:center; gap:.4rem; background:var(--brand);
         color:#fff; text-decoration:none; padding:.6rem 1rem; border:0;
         border-radius:10px; font:inherit; font-weight:600; cursor:pointer; }
  .btn:hover { filter:brightness(1.08); }
  .btn.ghost { background:transparent; color:var(--brand); border:1px solid var(--brand); }
  .btn[hidden] { display:none; }

  .retry { margin-top:.75rem; }
  .retry[hidden] { display:none; }

  .verify-form { margin-top:1.25rem; padding-top:1rem; border-top:1px solid var(--line); }
  .verify-form label { display:block; font-weight:600; margin-bottom:.35rem; font-size:.9rem; }
  .verify-form .row { display:flex; gap:.5rem; }
  .verify-form input { flex:1; min-width:0; padding:.55rem .7rem; border:1px solid var(--line);
                       border-radius:10px; font:inherit; background:transparent; color:inherit; }

  /* ---- QR (properly centered) ---- */
  .qr-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    margin: 1.25rem auto;
    width: 100%;
  }
  .qr-wrap img {
    width: 180px;
    height: 180px;
    image-rendering: pixelated;
    border-radius: 12px;
    border: 1px solid var(--line);
    padding: 6px;
    background: #fff;
  }

  footer { text-align:center; color:var(--muted); font-size:.85rem;
           padding:1rem 1rem calc(1rem + env(safe-area-inset-bottom));
           border-top:1px solid var(--line); }

  .offline { display:none; background:var(--danger-soft); color:var(--danger);
             text-align:center; padding:.5rem; font-size:.85rem; }
  body.is-offline .offline { display:block; }

  /* ---- Print ---- */
  @media print {
    header, footer, .langs, .actions, .verify-form, .retry, .offline, .copy-btn { display:none !important; }
    body { background:#fff; color:#000; }
    .card, .ngo-card, .scheme-card, .sign-block { box-shadow:none; border:1px solid #000; }
    a { color:#000; text-decoration:none; }
    .progress-bar { background:#000; }
  }
</style>
</head>
<body>

<div class="offline" role="alert">आप ऑफ़लाइन हैं / You are offline</div>

<header>
  <div class="bar">
    <a class="brand" href="/index.html" aria-label="Dipra Foundation home">
      <img src="/logo.png"
           onerror="this.onerror=null;this.src='https://lh3.googleusercontent.com/d/1uub_RlSpZ0mSPqde7lJvsv_qXMkL6M-G=w200';"

      <span>Dipra Foundation<small>Community pledge verification</small></span>

    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="hi" class="active" aria-pressed="true">हिं</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="card" aria-labelledby="title">
    <div id="mark" class="mark loading" aria-live="assertive" aria-atomic="true"></div>
    <h1 id="title">संकल्प सत्यापन</h1>
    <p id="lead" class="lead" aria-live="polite">रिकॉर्ड जाँचा जा रहा है…</p>

    <div id="badge" class="badge" hidden></div>

    <!-- NGO CARD -->
    <div id="ngoCard" class="ngo-card" hidden>
      <div class="ngo-header">
        <img id="ngoLogo" class="ngo-logo" alt="NGO logo">
        <div class="ngo-headinfo">

            <span id="ngoName"></span>

          <p class="ngo-tagline" id="ngoTagline"></p>

      </div>
      <div class="ngo-grid" id="ngoGrid"></div>
    </div>

    <!-- SCHEME CARD -->
    <div id="schemeCard" class="scheme-card" hidden>
      <div class="scheme-head">
        <img id="schemeIcon" class="scheme-icon" alt="">
        <div>
          <p class="scheme-title">
            <span id="schemeName"></span>
            <span id="schemeStatus" class="scheme-status" hidden></span>
          </p>
          <span class="scheme-code" id="schemeCode"></span>
        </div>
      </div>
      <p class="scheme-desc" id="schemeDesc"></p>
      <div class="scheme-stats">
        <span id="schemeCompleted"></span>
        <span id="schemeTarget"></span>
      </div>
      <div class="progress"><div class="progress-bar" id="schemeBar"></div></div>
    </div>

    <!-- PLEDGE DETAILS -->
    <div id="details" class="details" hidden></div>
    <p id="privateNote" class="private" hidden></p>
    <p id="status" class="status" role="status" aria-live="polite"></p>

    <!-- SIGNATURE BLOCK -->
    <div id="signBlock" class="sign-block" hidden>
      <img id="signImg" class="sign-img" alt="Authorized signature">
      <div class="sign-info">
        <b id="signName"></b>
        <span id="signOrg"></span>
      </div>
    </div>

    <div id="retryBox" class="retry" hidden>
      <button type="button" id="retryBtn" class="btn">फिर प्रयास करें / Retry</button>
    </div>

    <div class="actions">
      <a class="btn" href="/pledge" data-hi="नया संकल्प लें" data-en="Take a pledge">नया संकल्प लें</a>
      <button type="button" id="shareBtn" class="btn ghost" hidden>Share</button>
      <button type="button" id="printBtn" class="btn ghost" hidden>Print / PDF</button>
      <a id="certBtn" class="btn ghost" target="_blank" rel="noopener" hidden>Certificate</a>
    </div>

    <!-- QR (centered) -->
    <div class="qr-wrap" id="qrWrap" hidden>
      <img id="qrImg" alt="QR code for this pledge" width="180" height="180">
    </div>

    <form class="verify-form" id="verifyForm" novalidate>
      <label for="newId">दूसरा संकल्प ID जाँचें / Verify another ID</label>
      <div class="row">
        <input id="newId" name="id" type="text" inputmode="text" autocomplete="off"
               spellcheck="false" placeholder="DFP-YYYYMMDD-XXXXXXXX" maxlength="32" required>
        <button type="submit" class="btn">Verify</button>
      </div>
    </form>
  </section>
</main>

<footer>© <span id="year"></span> Dipra Foundation · <a href="/disclaimer/">Disclaimer</a></footer>

/* ---- Helpers ---- */
function formatDate(value, lang) {
  if (!value) return '—';
  const d = new Date(value);
  if (isNaN(d.getTime())) return String(value);
  try { return d.toLocaleDateString(lang==='hi'?'hi-IN':'en-IN',
        {year:'numeric',month:'short',day:'2-digit'}); }
  catch { return d.toLocaleDateString(); }
}
function formatDateTime(value, lang) {
  if (!value) return '—';
  const d = new Date(value);
  if (isNaN(d.getTime())) return String(value);
  try { return d.toLocaleString(lang==='hi'?'hi-IN':'en-IN',
        {year:'numeric',month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit'}); }
  catch { return d.toLocaleString(); }
}
function clearNode(el){ while(el.firstChild) el.removeChild(el.firstChild); }
function esc(s){ const d=document.createElement('div'); d.textContent = s==null?'':String(s); return d.innerHTML; }

function copyText(text, btn) {
  const done = () => { if (!btn) return; const o=btn.textContent;
    btn.textContent = words[language].copied;
    setTimeout(() => btn.textContent = o, 1200); };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const ta=document.createElement('textarea'); ta.value=text;
  ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch{}
  document.body.removeChild(ta);
}

function showRow(label, value, copyable) {
  const row=document.createElement('div'); row.className='row';
  const a=document.createElement('div'); a.className='label'; a.textContent=label;
  const b=document.createElement('div'); b.className='value';
  b.textContent = value || '—';
  if (copyable && value) {
    const btn=document.createElement('button'); btn.type='button';
    btn.className='copy-btn'; btn.textContent=words[language].copy;
    btn.setAttribute('aria-label', words[language].copy+': '+value);
    btn.addEventListener('click', ()=>copyText(value, btn));
    b.appendChild(btn);
  }
  row.append(a,b); $('details').appendChild(row);
}

function buildShareUrl() {
  return location.origin + location.pathname + '?id=' + encodeURIComponent(
    (new URLSearchParams(location.search).get('id') || '').toUpperCase());
}
function setQR(id) {
  const wrap=$('qrWrap'), img=$('qrImg');
  if (!id) { wrap.hidden=true; img.removeAttribute('src'); return; }
  img.src='https://api.qrserver.com/v1/create-qr-code/?size=320x320&data='+
    encodeURIComponent(buildShareUrl());
  wrap.hidden=false;
}

/* ---- NGO render (clean grid) ---- */
function renderNGO(ngo) {
  const card = $('ngoCard');
  if (!ngo || !ngo.name) { card.hidden = true; return; }

  $('ngoLogo').src = ngo.logoUrl || '/logo.png';
  $('ngoLogo').alt = (ngo.name || 'NGO') + ' logo';
  $('ngoLogo').onerror = function(){ this.onerror=null; this.src='/logo.png'; };

  $('ngoName').textContent = ngo.name;
  const v = $('ngoVerified');
  v.hidden = !ngo.verifiedBadge;
  v.textContent = '✔ ' + words[language].verifiedNGO;

  const tag = ngo.legalName || ngo.majorActivity || '';
  $('ngoTagline').textContent = tag;
  $('ngoTagline').hidden = !tag;

  const items = [];
  const add = (k, val, opts={}) => {
    if (val == null || val === '') return;
    items.push({ k, v: val, full: !!opts.full, html: !!opts.html });
  };

  add(words[language].regNo, ngo.registrationNo);
  add(words[language].darpan, ngo.ngoDarpanId);
  add(words[language].act, ngo.act);
  add(words[language].npoType, ngo.npoType);
  add(words[language].udyam, ngo.udyamReg);
  add(words[language].since, ngo.foundedYear);
  add(words[language].cityState, [ngo.city, ngo.state].filter(Boolean).join(', '));
  add(words[language].enterpriseType, ngo.enterpriseType);
  add(words[language].majorActivity, ngo.majorActivity);
  add(words[language].gst, ngo.gst);

  if (ngo.address) add(words[language].address, ngo.address, { full: true });

  if (ngo.email) {
    add(words[language].email,
      '<a href="mailto:' + esc(ngo.email) + '">' + esc(ngo.email) + '</a>',
      { html: true });
  }
  if (ngo.mobile) {
    const tel = String(ngo.mobile).replace(/[^\d+]/g, '');
    add(words[language].mobile,
      '<a href="tel:' + esc(tel) + '">' + esc(ngo.mobile) + '</a>',
      { html: true });
  }

  const grid = $('ngoGrid');
  clearNode(grid);
  items.forEach(it => {
    const div = document.createElement('div');
    div.className = 'ngo-item' + (it.full ? ' full' : '');
    const k = document.createElement('span');
    k.className = 'k'; k.textContent = it.k;
    const val = document.createElement('span');
    val.className = 'v';
    if (it.html) val.innerHTML = it.v;
    else val.textContent = it.v;
    div.append(k, val);
    grid.appendChild(div);
  });

  card.hidden = false;
}

/* ---- Scheme render ---- */
function renderScheme(s) {
  const card=$('schemeCard');
  if (!s || (!s.name && !s.nameEn)) { card.hidden=true; return; }
  const name = language==='hi' ? (s.name || s.nameEn) : (s.nameEn || s.name);
  $('schemeName').textContent = name || '—';
  $('schemeCode').textContent = s.code ? (words[language].schemeCode+': '+s.code) : '';

  const desc = language==='hi' ? (s.description || '') : (s.descriptionEn || s.description || '');
  $('schemeDesc').textContent = desc;
  $('schemeDesc').hidden = !desc;

  const icon=$('schemeIcon');
  if (s.logoUrl) { icon.src = s.logoUrl; icon.hidden=false; }
  else if (s.category) { icon.src = '/scheme-icon.png'; icon.hidden=false; }
  else icon.hidden=true;

  const status=$('schemeStatus');
  if (s.status === 'active' || s.status === 'closed') {
    status.hidden=false;
    status.className = 'scheme-status ' + s.status;
    status.textContent = s.status === 'active'
      ? words[language].statusActive : words[language].statusClosed;
  } else status.hidden=true;

  const done = Number(s.completedPledges) || 0;
  const target = Number(s.targetPledges) || 0;
  if (target > 0) {
    const pct = Math.min(100, Math.round(done/target*100));
    $('schemeCompleted').textContent = done.toLocaleString(language==='hi'?'hi-IN':'en-IN') + ' ✓';
    $('schemeTarget').textContent = '/ ' + target.toLocaleString(language==='hi'?'hi-IN':'en-IN') + ' (' + pct + '%)';
    $('schemeBar').style.width = pct + '%';
    $('schemeBar').parentElement.style.display = '';
  } else {
    $('schemeCompleted').textContent = done ? done.toLocaleString() + ' ✓' : '';
    $('schemeTarget').textContent = '';
    $('schemeBar').parentElement.style.display = 'none';
  }
  card.hidden = false;
}

/* ---- Signature render ---- */
function renderSignature(r) {
  const block=$('signBlock');
  const hasSig = r.signatureUrl || r.signedBy;
  if (!hasSig) { block.hidden=true; return; }
  const img=$('signImg');
  if (r.signatureUrl) { img.src = r.signatureUrl; img.hidden=false; }
  else img.hidden=true;
  $('signName').textContent = r.signedBy || words[language].authorizedBy;
  $('signOrg').textContent  = (r.ngo && r.ngo.name) || 'Dipra Foundation';
  block.hidden = false;
}

/* ---- Reset / render ---- */
function resetUI() {
  $('mark').className='mark loading'; $('mark').textContent='';
  $('lead').textContent = words[language].loading;
  $('badge').hidden=true; $('badge').textContent='';
  $('details').hidden=true; clearNode($('details'));
  $('privateNote').hidden=true; $('privateNote').textContent='';
  $('status').textContent='';
  $('ngoCard').hidden=true;
  $('schemeCard').hidden=true;
  $('signBlock').hidden=true;
  $('retryBox').hidden=true;
  $('shareBtn').hidden=true;
  $('printBtn').hidden=true;
  $('certBtn').hidden=true;
  $('qrWrap').hidden=true;
  $('title').textContent = words[language].title;
}

function renderResult(r) {
  lastResult=r; lastErrorKey=null;
  $('title').textContent = words[language].title;
  $('mark').className='mark valid'; $('mark').textContent='✓';
  $('lead').textContent = words[language].verified;
  $('badge').textContent = words[language].verified; $('badge').hidden=false;
  $('retryBox').hidden=true;

  renderNGO(r.ngo || NGO_STATIC);
  renderScheme(r.scheme);

  const d=$('details'); clearNode(d); d.hidden=false;
  showRow(words[language].pledgeId, r.pledgeId, true);
  if (r.detailsPublic) {
    showRow(words[language].name, r.name, false);
    showRow(words[language].primary, r.primarySector, false);
    if (r.secondarySectors) showRow(words[language].secondary, r.secondarySectors, false);
    $('privateNote').hidden=true;
  } else {
    $('privateNote').textContent = words[language].private;
    $('privateNote').hidden=false;
  }
  showRow(words[language].date, formatDate(r.date, language), false);
  showRow(words[language].verifiedOn,
    formatDateTime(r.verifiedAt || new Date().toISOString(), language), false);
  $('status').textContent='';

  renderSignature(r);

  $('shareBtn').hidden=false;
  $('printBtn').hidden=false;
  if (r.certificateUrl) {
    const c=$('certBtn'); c.href=r.certificateUrl; c.hidden=false;
    c.textContent = words[language].certificate;
  }
  setQR(r.pledgeId || '');
}

function renderFailure(key) {
  lastResult=null; lastErrorKey=key;
  $('title').textContent = words[language].title;
  $('mark').className='mark invalid'; $('mark').textContent='!';
  $('lead').textContent = words[language].invalid;
  $('badge').hidden=true; $('badge').textContent='';
  $('details').hidden=true; clearNode($('details'));
  $('privateNote').hidden=true; $('privateNote').textContent='';
  $('ngoCard').hidden=true;
  $('schemeCard').hidden=true;
  $('signBlock').hidden=true;
  $('status').textContent = words[language][key] || words[language].error;
  $('retryBox').hidden=false;
  $('shareBtn').hidden=true;
  $('printBtn').hidden=true;
  $('certBtn').hidden=true;
  $('qrWrap').hidden=true;
}

function reRender() {
  if (lastResult) renderResult(lastResult);
  else if (lastErrorKey) renderFailure(lastErrorKey);
  else {
    $('title').textContent = words[language].title;
    $('lead').textContent = words[language].loading;
    $('badge').hidden=true; $('details').hidden=true;
    $('retryBox').hidden=true;
  }
}

/* ---- Language ---- */
function translate(lang) {
  if (lang!=='hi' && lang!=='en') return;
  language=lang;
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-lang]').forEach(b=>{
    const a=b.dataset.lang===lang;
    b.classList.toggle('active',a); b.setAttribute('aria-pressed',String(a));
  });
  document.querySelectorAll('[data-hi][data-en]').forEach(el=>{
    el.textContent = el.getAttribute('data-'+lang);
  });
  $('retryBtn').textContent = words[lang].retry;
  $('verifyForm').querySelector('button[type=submit]').textContent = words[lang].verify;
  reRender();
}
document.querySelectorAll('[data-lang]').forEach(b=>
  b.addEventListener('click', ()=>translate(b.dataset.lang)));

/* ---- Verify ---- */
function getPledgeIdFromUrl() {
  return (new URLSearchParams(location.search).get('id') || '').trim().toUpperCase();
}
async function fetchWithTimeout(url, options={}, ms=FETCH_TIMEOUT_MS) {
  const c=new AbortController();
  const t=setTimeout(()=>c.abort(), ms);
  try { return await fetch(url, { ...options, signal:c.signal }); }
  finally { clearTimeout(t); }
}
async function verify() {
  resetUI();
  const id=getPledgeIdFromUrl();
  if (!ID_REGEX.test(id)) { renderFailure('notFound'); return; }
  try {
    const url = API + '?action=verifyPledge&id=' + encodeURIComponent(id);
    const r = await fetchWithTimeout(url, {method:'GET',headers:{Accept:'application/json'}});
    if (!r.ok) { renderFailure('error'); return; }
    let data; try { data = await r.json(); } catch { renderFailure('error'); return; }
    if (!data || !data.verified) { renderFailure('notFound'); return; }
    renderResult(data);
  } catch (err) {
    console.error('verify failed', err);
    renderFailure(err && err.name==='AbortError' ? 'timeout' : 'error');
  }
}

/* ---- Actions ---- */
$('shareBtn').addEventListener('click', async () => {
  const url=buildShareUrl();
  const title='Dipra Foundation pledge verification';
  const text = (lastResult && lastResult.pledgeId)
    ? 'Verified pledge ' + lastResult.pledgeId + ' — Dipra Foundation'
    : title;
  if (navigator.share) { try { await navigator.share({title,text,url}); } catch {} }
  else copyText(url, $('shareBtn'));
});
$('printBtn').addEventListener('click', ()=>window.print());
$('retryBtn').addEventListener('click', verify);

$('verifyForm').addEventListener('submit', (e)=>{
  e.preventDefault();
  const v=($('newId').value||'').trim().toUpperCase();
  if (!v) return;
  const u=new URL(location.href); u.searchParams.set('id',v);
  history.pushState({}, '', u.toString());
  verify();
});

window.addEventListener('online',  ()=>document.body.classList.remove('is-offline'));
window.addEventListener('offline', ()=>document.body.classList.add('is-offline'));
if (!navigator.onLine) document.body.classList.add('is-offline');

/* ---- Boot ---- */
(function init(){
  const y=$('year'); if (y) y.textContent=new Date().getFullYear();
  translate(document.documentElement.lang==='en'?'en':'hi');
  verify();
})();
</script>
