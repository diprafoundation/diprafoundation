 education:{hi:'शिक्षा एवं साक्षरता',en:'Education & Literacy',pledge:'Education & Literacy',base:[['बच्चे की उम्र और कक्षा के अनुसार नियमित उपस्थिति व सीखने की प्रगति देखें।','Track regular attendance and learning progress at the child’s age and grade level.'],['रोज़ पढ़ने, सवाल पूछने और अभ्यास करने की आदत को प्रोत्साहित करें।','Encourage daily reading, questions, and practice.'],['छात्रवृत्ति/योजना की पात्रता और तारीखें केवल आधिकारिक पोर्टल पर जाँचें।','Check scholarship eligibility and dates only on official portals.'],['बच्चे के स्कूल रिकॉर्ड, फोटो और निजी जानकारी सुरक्षित रखें।','Protect a child’s school records, photos, and personal information.']],programs:[['पढ़ने की आदत','Building a reading habit','घर और समुदाय में रोज़ पढ़ने के लिए सुरक्षित, उम्र-अनुकूल समय और सामग्री तय करें।','Plan safe, age-appropriate time and materials for daily reading at home and in the community.'],['स्कूल से जुड़ाव','Staying connected to school','उपस्थिति, सीखने की कठिनाई और स्कूल से संवाद के लिए एक सरल सहायता योजना बनाएँ।','Make a simple support plan for attendance, learning difficulties, and school communication.'],['छात्रवृत्ति जागरूकता','Scholarship awareness','पात्रता, जरूरी दस्तावेज़ और आवेदन की अंतिम तारीख आधिकारिक स्रोत से मिलाएँ।','Confirm eligibility, required documents, and deadlines through official sources.'],['सुरक्षित डिजिटल शिक्षा','Safer digital learning','ऑनलाइन पढ़ाई में मजबूत पासवर्ड, सुरक्षित लिंक और निजी जानकारी की सुरक्षा सिखाएँ।','Teach strong passwords, safe links, and privacy for online learning.'],['समावेशी शिक्षा','Inclusive education','लिंग, जाति, भाषा, आय या दिव्यांगता से परे सीखने में बराबर भागीदारी का समर्थन करें।','Support equal participation in learning regardless of gender, caste, language, income, or disability.']]},
 health:{hi:'स्वास्थ्य एवं परिवार कल्याण',en:'Health & Family Welfare',pledge:'Health & Family Welfare',base:[['स्वास्थ्य समस्या में योग्य स्वास्थ्यकर्मी/चिकित्सक से सलाह लें; गंभीर लक्षण में देर न करें।','Consult a qualified health worker or clinician; do not delay for serious symptoms.'],['साफ पानी, हाथ धोने और सुरक्षित भोजन की दैनिक आदतें अपनाएँ।','Practice clean water, handwashing, and safe food habits.'],['टीकाकरण, जाँच और सरकारी सुविधा की जानकारी आधिकारिक स्वास्थ्यकर्मी से लें।','Ask an authorised health worker about vaccinations, screenings, and public services.'],['किसी की स्वास्थ्य रिपोर्ट या पहचान बिना अनुमति साझा न करें।','Do not share anyone’s health records or identity without consent.']],programs:[['स्वच्छता और सुरक्षित पानी','Hygiene and safe water','हाथ धोने, सुरक्षित भंडारण और साफ-सफाई के छोटे व्यवहार घरों में अपनाएँ।','Practice handwashing, safe water storage, and hygiene at home.'],['मातृ एवं शिशु स्वास्थ्य','Maternal and child health','गर्भावस्था और बच्चे के स्वास्थ्य के लिए ASHA/ANM तथा योग्य सेवा केंद्र से समय पर संपर्क करें।','Contact an ASHA/ANM worker and qualified service centre in time for maternal and child health.'],['पोषण जागरूकता','Nutrition awareness','स्थानीय उपलब्ध पौष्टिक भोजन और स्वच्छ भोजन तैयारी पर भरोसेमंद स्वास्थ्य सलाह लें।','Use trusted health guidance on locally available nutritious food and safe preparation.'],['मानसिक स्वास्थ्य सहयोग','Mental health support','सम्मानपूर्वक सुनें, भरोसेमंद व्यक्ति/योग्य परामर्शदाता से सहायता लें; आपात स्थिति में 112।','Listen without stigma, seek trusted or qualified support, and call 112 in an emergency.'],['स्वास्थ्य योजनाएँ और सेवाएँ','Health schemes and services','योजना, अस्पताल और शिकायत प्रक्रिया की पात्रता सरकारी स्रोत से जाँचें।','Check eligibility, hospitals, and grievance routes through government sources.']]},
 agriculture:{hi:'कृषि एवं पशुपालन',en:'Agriculture & Animal Husbandry',pledge:'Agriculture',base:[['बुवाई और फसल चुनाव से पहले स्थानीय मौसम, मिट्टी और कृषि विशेषज्ञ की सलाह देखें।','Check local weather, soil, and agricultural advice before choosing crops.'],['कीटनाशक/खाद के लेबल और सुरक्षा निर्देश मानें; दवा बच्चों से दूर रखें।','Follow pesticide and fertiliser labels and safety directions; keep them away from children.'],['पानी और मिट्टी की सेहत बचाने के लिए स्थानीय टिकाऊ तरीकों पर विचार करें।','Consider local sustainable practices that protect water and soil health.'],['पशु बीमारी या टीकाकरण के लिए योग्य पशु चिकित्सक से सलाह लें।','Consult a qualified veterinarian about animal illness or vaccination.']],programs:[['मिट्टी और फसल योजना','Soil and crop planning','बुवाई से पहले मिट्टी परीक्षण, स्थानीय मौसम और फसल विविधता की जानकारी लें।','Review soil testing, local weather, and crop diversity before sowing.'],['सुरक्षित कृषि उपयोग','Safer farm inputs','खाद/कीटनाशक का सही लेबल पढ़ें, सुरक्षात्मक निर्देश मानें और खाली पैक सुरक्षित निपटाएँ।','Read input labels, use protective measures, and dispose of empty packs safely.'],['जल संरक्षण','Water conservation','खेत की जरूरत के अनुसार सिंचाई करें और पानी बचाने के स्थानीय तरीकों पर सलाह लें।','Irrigate according to crop need and seek local advice on water-saving methods.'],['पशु स्वास्थ्य एवं कल्याण','Animal health and welfare','स्वच्छ पानी, संतुलित चारा, सुरक्षित आश्रय और पशु चिकित्सकीय देखभाल सुनिश्चित करें।','Provide clean water, balanced feed, safe shelter, and veterinary care.'],['योजना, बीमा और रिकॉर्ड','Schemes, insurance, and records','फसल बीमा/अनुदान की शर्तें सरकारी पोर्टल से जाँचें और रसीदें/आवेदन संख्या रखें।','Check insurance and subsidy terms on official portals and keep receipts/application IDs.']]},
 women:{hi:'महिला विकास एवं सशक्तिकरण',en:'Women’s Development & Empowerment',pledge:"Women's Development & Empowerment",base:[['महिलाओं की गरिमा, सहमति, निजता और निर्णय लेने के अधिकार का सम्मान करें।','Respect women’s dignity, consent, privacy, and decision-making rights.'],['शिक्षा, कौशल, स्वास्थ्य और रोजगार तक बराबर अवसरों को बढ़ावा दें।','Promote equal access to education, skills, health, and employment.'],['SHG/बैंकिंग जानकारी के लिए पंजीकृत संस्था और आधिकारिक योजना स्रोत जाँचें।','Check registered institutions and official schemes for SHG/banking information.'],['तत्काल खतरे में सुरक्षित स्थान जाएँ और 112 पर कॉल करें।','Move to safety and call 112 if there is immediate danger.']],programs:[['अधिकार और सुरक्षित सहायता','Rights and safe support','उत्पीड़न/हिंसा की स्थिति में सुरक्षित व्यक्ति, सेवा और शिकायत विकल्प पहले से पहचानें।','Identify trusted people, services, and complaint options in advance for harassment or violence.'],['स्वास्थ्य और पोषण','Health and nutrition','स्वास्थ्य प्रश्नों के लिए योग्य स्वास्थ्यकर्मी से सलाह लें और निजी जानकारी की रक्षा करें।','Seek qualified health advice and protect personal information.'],['SHG और वित्तीय साक्षरता','SHGs and financial literacy','समूह के लेन-देन का लिखित हिसाब रखें, शर्तें पढ़ें और OTP/PIN किसी से साझा न करें।','Keep written transaction records, read terms, and never share OTPs or PINs.'],['कौशल और आजीविका','Skills and livelihoods','स्थानीय प्रशिक्षण/रोजगार अवसर की पात्रता और शुल्क आधिकारिक स्रोत से सत्यापित करें।','Verify eligibility and fees for local training or work through official sources.'],['डिजिटल सुरक्षा','Digital safety','अनजान लिंक, नौकरी/ऋण के अग्रिम शुल्क और निजी फोटो/दस्तावेज़ माँगने वालों से सावधान रहें।','Be cautious of unknown links, advance job/loan fees, and requests for private photos/documents.']]},
 family:{hi:'बाल कल्याण एवं वृद्धजन',en:'Children & Elderly Welfare',pledge:'Children',base:[['बच्चों की सुरक्षा, सम्मान, उम्र-अनुकूल देखभाल और गोपनीयता प्राथमिक रखें।','Prioritise children’s safety, dignity, age-appropriate care, and privacy.'],['वृद्धजन की सहमति, सम्मान और स्वतंत्र निर्णय का आदर करें।','Respect older adults’ consent, dignity, and independent choices.'],['बाल अधिकार/कल्याण सेवाओं के लिए सरकारी स्रोत और अधिकृत सेवा से संपर्क करें।','Use government sources and authorised services for child-welfare support.'],['तत्काल खतरे में 112; बच्चे की मदद के लिए Child Helpline 1098।','Call 112 for immediate danger; Child Helpline 1098 for child assistance.']],programs:[['बाल सुरक्षा','Child safety','बच्चे की बात सुनें, सुरक्षित वयस्क से मदद दिलाएँ और जोखिम की सूचना उचित प्राधिकरण को दें।','Listen to the child, connect them to a safe adult, and report risk to the proper authority.'],['पोषण और सीखना','Nutrition and learning','बच्चों की उम्र-अनुकूल सीखने, भोजन और नियमित देखभाल में परिवार/स्कूल का सहयोग लें।','Support age-appropriate learning, nutrition, and routine care with families/schools.'],['वृद्धजन सम्मान और सुरक्षा','Dignity and safety for older adults','दवाओं/सुविधा की जानकारी अधिकृत स्रोत से लें और वित्तीय फैसले में व्यक्ति की सहमति रखें।','Use authorised sources for care information and respect consent in financial decisions.'],['धोखाधड़ी से बचाव','Fraud prevention','OTP, PIN, बैंक पासवर्ड या दूर से फोन नियंत्रण किसी को न दें; संदिग्ध कॉल परिवार/बैंक से जाँचें।','Never share OTPs, PINs, bank passwords, or remote phone access; verify suspicious calls.'],['समावेशी समुदाय','Inclusive communities','दिव्यांगता, उम्र, भाषा या आर्थिक स्थिति के आधार पर भेदभाव न करें; सहायता सुलभ बनाएँ।','Avoid discrimination based on disability, age, language, or income; make support accessible.']]},
 skills:{hi:'कौशल विकास एवं रोज़गार',en:'Skill Development & Employment',pledge:'Skill Development',base:[['नौकरी/प्रशिक्षण की संस्था, प्रमाण-पत्र और शुल्क आधिकारिक स्रोत से जाँचें।','Verify the organisation, credential, and fees for jobs/training through official sources.'],['रोजगार देने के नाम पर अनजान व्यक्ति को OTP, PIN या अग्रिम भुगतान न दें।','Do not share OTPs/PINs or pay unknown people for promised jobs.'],['समझौते, वेतन, कटौती और काम की शर्तें पढ़कर प्रति सुरक्षित रखें।','Read and keep copies of contracts, wages, deductions, and work terms.'],['समस्या में संबंधित संस्था की शिकायत व्यवस्था और सरकारी पोर्टल का उपयोग करें।','Use the organisation’s grievance process and government portals when needed.']],programs:[['डिजिटल और नौकरी कौशल','Digital and job skills','ईमेल, दस्तावेज़, ऑनलाइन आवेदन और सुरक्षित पासवर्ड का अभ्यास करें।','Practice email, documents, online applications, and secure passwords.'],['नौकरी खोज में धोखाधड़ी पहचानें','Spot job-search scams','कंपनी का आधिकारिक पता जाँचें; नौकरी दिलाने के लिए OTP या तत्काल भुगतान न दें।','Check the company’s official presence; never share OTPs or pay urgently for a job.'],['काम की शर्तें समझें','Understand work terms','जॉइनिंग से पहले वेतन, काम के घंटे, कटौती और शिकायत संपर्क लिखित में समझें।','Understand salary, hours, deductions, and grievance contacts in writing before joining.'],['स्वरोजगार और प्रशिक्षण','Self-employment and training','किसी कोर्स/ऋण योजना की फीस, ब्याज, पात्रता और शर्तें अधिकृत स्रोत से जाँचें।','Verify fees, interest, eligibility, and terms of a course or loan scheme through authorised sources.'],['ऋण-वसूली एजेंट से उत्पीड़न: अधिकार और शिकायत','Loan recovery harassment: awareness and complaints','ऋण-वसूली उत्पीड़न में आधिकारिक शिकायत संपर्क और सहायता देखें।','Review official complaint contacts and support for recovery harassment.']],legal:true}

let activeTopic='';
function refreshTopicGuide(lang){if(!activeTopic)return;const item=topicCatalog[activeTopic];$('#topicSectorTitle').textContent=lang==='en'?item.en:item.hi;$('#topicSectorIntro').textContent=lang==='en'?'Choose one of five short awareness programs. Read the guidance, then create a self-guided learning record and take a separate pledge.':'पाँच छोटे जागरूकता कार्यक्रमों में से चुनें। जानकारी पढ़कर स्वयं-अध्ययन का रिकॉर्ड बनाएँ और अलग से संकल्प लें।';$$('.program-choice').forEach((button,index)=>{const p=item.programs[index];button.querySelector('strong').textContent=lang==='en'?p[1]:p[0];button.querySelector('span').textContent=lang==='en'?'Open this awareness program':'यह जागरूकता कार्यक्रम खोलें';});if(window.activeProgramIndex!==undefined)renderProgramDetails(window.activeProgramIndex);}
function renderProgramDetails(index){const item=topicCatalog[activeTopic],program=item.programs[index],lang=document.documentElement.lang==='en'?'en':'hi';window.activeProgramIndex=index;$('#programTitle').textContent=lang==='en'?program[1]:program[0];$('#programDescription').textContent=program.legal?(lang==='en'?'General awareness only. Rules may vary by lender type and loan product; check the current RBI directions and your lender’s grievance policy. This is not legal advice.':'यह सामान्य जागरूकता है। नियम lender और loan product के अनुसार बदल सकते हैं; RBI के मौजूदा निर्देश और lender की शिकायत नीति जाँचें। यह कानूनी सलाह नहीं है।'):(lang==='en'?'Five practical points for this awareness program.':'इस जागरूकता कार्यक्रम के पाँच उपयोगी बिंदु।');const points=$('#programPoints');points.replaceChildren();let rows;if(program.legal){rows=lang==='en'?['For covered RBI-regulated lenders, recovery agents must not intimidate, harass, publicly humiliate, or intrude on family privacy. Calls for overdue-loan recovery should not be made before 8:00 a.m. or after 7:00 p.m. under the applicable RBI instructions.','Ask for the agent’s name, lender, and authorisation; verify them with the lender using the official number. Do not share OTP, PIN, passwords, or pay to a personal UPI/account.','Write to the lender’s grievance officer. Keep the loan statement, dates, call logs, messages, receipts, and complaint reference. Do not ignore genuine notices; dispute incorrect amounts in writing.','If an RBI-regulated entity does not reply within 30 days, or you are dissatisfied with its reply, check the RBI Integrated Ombudsman eligibility and submit through CMS.','For consumer grievance assistance use NCH 1915 / 1800-11-4000. If threatened, the facts may fall under criminal intimidation provisions (BNS section 351); seek appropriate help. For immediate danger, call police/emergency number 112 and preserve evidence safely.']:['RBI-विनियमित और इन निर्देशों के दायरे वाले lender के recovery agents धमकी, उत्पीड़न, सार्वजनिक अपमान या परिवार की निजता में दखल नहीं कर सकते। लागू RBI निर्देशों के अनुसार बकाया ऋण-वसूली के लिए सुबह 8 बजे से पहले या शाम 7 बजे के बाद कॉल नहीं होनी चाहिए।','एजेंट का नाम, lender और authorization पूछें; lender के आधिकारिक नंबर से पुष्टि करें। OTP, PIN, पासवर्ड साझा न करें और निजी UPI/account में भुगतान न करें।','Lender के grievance officer को लिखित शिकायत दें। loan statement, तारीख, call log, संदेश, रसीद और complaint reference रखें। असली notice को अनदेखा न करें; गलत राशि पर लिखित आपत्ति दें।','RBI-विनियमित संस्था 30 दिनों में जवाब न दे या जवाब से संतुष्टि न हो, तो RBI Integrated Ombudsman की पात्रता जाँचकर CMS पर शिकायत करें।','उपभोक्ता शिकायत हेतु NCH 1915 / 1800-11-4000 उपयोग करें। धमकी की स्थिति तथ्यों के अनुसार BNS धारा 351 के अंतर्गत आ सकती है; उचित सहायता लें। तत्काल खतरे में पुलिस/आपात सेवा 112 पर कॉल करें और सुरक्षित रूप से प्रमाण रखें।'];}else{rows=lang==='en'?[program[3],item.base[0][1],item.base[1][1],item.base[2][1],item.base[3][1]]:[program[2],item.base[0][0],item.base[1][0],item.base[2][0],item.base[3][0]];}rows.forEach(text=>{const li=document.createElement('li');li.textContent=text;points.appendChild(li);});$('#programDetail').hidden=false;$('#programRead').checked=false;$('#programRead').disabled=true;$('#makeAwarenessCertificate').disabled=true;$('#awarenessCertificate').hidden=true;const contact=$('#programContacts');contact.replaceChildren();contact.hidden=false;const title=document.createElement('h4');title.textContent=lang==='en'?'Useful official contacts and portals':'जरूरी आधिकारिक संपर्क और पोर्टल';contact.appendChild(title);const list=document.createElement('ul');const links=program.legal?recoveryLinks.map(x=>[lang==='en'?x[4]:x[0],x[1],lang==='en'?x[3]:x[2]]):commonTopicLinks.map(x=>[lang==='en'?x[1]:x[0],x[2],lang==='en'?x[4]:x[3]]);links.forEach(entry=>{const li=document.createElement('li');const a=document.createElement('a');a.href=entry[1];a.textContent=entry[0];if(entry[1].startsWith('http')){a.target='_blank';a.rel='noopener noreferrer';}li.append(a,document.createTextNode(' — '+(entry[2]||'')));list.appendChild(li);});contact.appendChild(list);const sources=document.createElement('p');sources.className='source-note';if(program.legal){const link=document.createElement('a');link.href='https://www.rbi.org.in/Scripts/PublicationReportDetails.aspx?ID=1229&UrlPage=';link.target='_blank';link.rel='noopener noreferrer';link.textContent=lang==='en'?'RBI recovery-agent instructions':'RBI के recovery-agent निर्देश';sources.append(link,document.createTextNode(' · '));const bns=document.createElement('a');bns.href='https://www.indiacode.nic.in/bitstream/123456789/20062/1/a2023-45.pdf';bns.target='_blank';bns.rel='noopener noreferrer';bns.textContent=lang==='en'?'Bharatiya Nyaya Sanhita, 2023':'भारतीय न्याय संहिता, 2023';sources.appendChild(bns);}else{sources.textContent=lang==='en'?'Confirm changing numbers and eligibility on the linked official portals.':'नंबर और पात्रता बदल सकते हैं; जुड़े आधिकारिक पोर्टल पर पुष्टि करें।';}contact.appendChild(sources);$('#topicPledgeLink').href='/pledge/?sector='+encodeURIComponent(item.pledge);if('IntersectionObserver'in window){const observer=new IntersectionObserver(entries=>{if(entries.some(entry=>entry.isIntersecting)){ $('#programRead').disabled=false;observer.disconnect();}},{threshold:.6});observer.observe($('#programEnd'));}else $('#programRead').disabled=false;}
function openTopic(key){activeTopic=key;window.activeProgramIndex=undefined;$('#awarenessCertificate').hidden=true;$('#programDetail').hidden=true;$('#topicGuide').hidden=false;const grid=$('#programGrid');grid.replaceChildren();topicCatalog[key].programs.forEach((program,index)=>{const button=document.createElement('button');button.type='button';button.className='program-choice';button.setAttribute('aria-pressed','false');const title=document.createElement('strong');title.textContent=document.documentElement.lang==='en'?program[1]:program[0];const sub=document.createElement('span');sub.textContent=document.documentElement.lang==='en'?'Open this awareness program':'यह जागरूकता कार्यक्रम खोलें';button.append(title,sub);button.addEventListener('click',()=>{$$('.program-choice',grid).forEach(x=>x.setAttribute('aria-pressed','false'));button.setAttribute('aria-pressed','true');renderProgramDetails(index);});grid.appendChild(button);});refreshTopicGuide(document.documentElement.lang);$('#topicGuide').scrollIntoView({behavior:'smooth',block:'start'});}
$$('.topic-open').forEach(button=>button.addEventListener('click',()=>openTopic(button.dataset.sector)));
$('#topicGuideClose').addEventListener('click',()=>{$('#topicGuide').hidden=true;activeTopic='';});
$('#programRead').addEventListener('change',()=>{$('#makeAwarenessCertificate').disabled=!$('#programRead').checked||!$('#awarenessName').value.trim();});
$('#awarenessName').addEventListener('input',()=>{$('#makeAwarenessCertificate').disabled=!$('#programRead').checked||!$('#awarenessName').value.trim();});
$('#makeAwarenessCertificate').addEventListener('click',()=>{if(!$('#programRead').checked||!$('#awarenessName').value.trim())return;const item=topicCatalog[activeTopic],program=item.programs[window.activeProgramIndex],lang=document.documentElement.lang==='en'?'en':'hi';$('#awarenessCertificateIntro').textContent=lang==='en'?'This records that the learner completed the self-guided awareness reading:':'यह स्वयं-अध्ययन जागरूकता कार्यक्रम पढ़ने का रिकॉर्ड है:';$('#awarenessCertificateName').textContent=$('#awarenessName').value.trim();$('#awarenessCertificateProgram').textContent=(lang==='en'?program[1]:program[0])+' · '+(lang==='en'?item.en:item.hi);$('#awarenessCertificateDate').textContent=new Intl.DateTimeFormat(lang==='en'?'en-IN':'hi-IN',{dateStyle:'long'}).format(new Date());$('#awarenessCertificate').hidden=false;$('#awarenessCertificate').scrollIntoView({behavior:'smooth',block:'center'});});
$('#printAwarenessCertificate').addEventListener('click',()=>{document.body.classList.add('print-awareness-certificate');window.print();});window.addEventListener('afterprint',()=>document.body.classList.remove('print-awareness-certificate'));

/* ---------- Language Switcher ---------- */
function setLang(lang){
  document.body.classList.toggle('lang-hi', lang === 'hi');
  document.body.classList.toggle('lang-en', lang === 'en');
  document.documentElement.lang = lang;
  $$('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  try { localStorage.setItem('uplift_lang', lang); } catch(e){}
  
  // Update all elements with data-hi and data-en attributes
  $$('[data-hi][data-en]').forEach(el => {
    const t = lang === 'en' ? el.getAttribute('data-en') : el.getAttribute('data-hi');
    if(t !== null){
      if(el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
        el.placeholder = t;
      } else {
        // Preserve authored inline emphasis and line breaks in translated strings.
        el.innerHTML = t;
      }
    }
  });
  if(window.refreshTopicGuide) window.refreshTopicGuide(lang);
}
$$('.lang-btn').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
try { const savedLang = localStorage.getItem('uplift_lang'); if(savedLang === 'hi' || savedLang === 'en') setLang(savedLang); } catch(e) { setLang('hi'); }

/* ---------- Mobile Nav ---------- */
const burger = $('#burger'), mainNav = $('#mainNav');
if (burger && mainNav) {
  const navClose = $('#navClose'), navBackdrop = $('#navBackdrop'), siteHeader = burger.closest('header');
  function setMobileNav(open, restoreFocus=false) {
    burger.classList.toggle('open', open);
    mainNav.classList.toggle('open', open);
    mainNav.setAttribute('aria-hidden', String(!open));
    mainNav.inert = !open;
    burger.setAttribute('aria-expanded', String(open));
    burger.setAttribute('aria-label', open ? (document.documentElement.lang === 'en' ? 'Close menu' : 'मेनू बंद करें') : (document.documentElement.lang === 'en' ? 'Open menu' : 'मेनू खोलें'));
    document.body.classList.toggle('modal-open', open);
    if (siteHeader) siteHeader.classList.toggle('menu-open', open);
    if (navBackdrop) {
      navBackdrop.hidden = !open;
      navBackdrop.setAttribute('aria-hidden', String(!open));
      navBackdrop.classList.toggle('open', open);
    }
    if (open && navClose) navClose.focus({preventScroll:true});
    else if (restoreFocus) burger.focus({preventScroll:true});
  }
  burger.addEventListener('click', () => setMobileNav(burger.getAttribute('aria-expanded') !== 'true'));
  if (navClose) navClose.addEventListener('click', () => setMobileNav(false, true));
  if (navBackdrop) navBackdrop.addEventListener('click', () => setMobileNav(false, true));
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && burger.getAttribute('aria-expanded') === 'true') setMobileNav(false, true);
  });
  $$('#mainNav a').forEach(a => a.addEventListener('click', () => {
    setMobileNav(false);
  }));
}

/* ---------- Office Bearers Accordion ---------- */
const accordionHeaders = $$('.accordion-header');
accordionHeaders.forEach(header => {
  header.addEventListener('click', function() {
    const isActive = this.classList.contains('active');
    
    // Close all open items
    accordionHeaders.forEach(h => {
      h.classList.remove('active');
      h.nextElementSibling.style.maxHeight = null;
    });

    // Open the clicked item if it was closed
    if (!isActive) {
      this.classList.add('active');
      const body = this.nextElementSibling;
      body.style.maxHeight = body.scrollHeight + "px";
    }
  });
});
