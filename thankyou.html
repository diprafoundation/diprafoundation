<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Thank You | DIPRA Foundation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #4CAF50, #2e7d32);
      color: white;
      text-align: center;
      padding: 60px 20px;
      margin: 0;
    }
    .thankyou-box {
      background: white;
      color: #333;
      border-radius: 12px;
      padding: 40px 20px;
      max-width: 500px;
      margin: 80px auto;
      box-shadow: 0px 8px 20px rgba(0,0,0,0.2);
    }
    h1 {
      color: #2e7d32;
      margin-bottom: 20px;
    }
    p {
      font-size: 18px;
      margin-bottom: 30px;
    }
    .btn-home {
      background: #4CAF50;
      color: white;
      padding: 12px 24px;
      text-decoration: none;
      border-radius: 8px;
      font-size: 16px;
      transition: 0.3s;
    }
    .btn-home:hover {
      background: #388e3c;
    }
  </style>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/logo.png">
<link rel="icon" type="image/png" href="/logo.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="दिप्र">
</head>
<body>

  <div class="thankyou-box">
    <h1>🎉 Thank You!</h1>
    <p>Your donation request has been successfully submitted.<br>
       We will review your application and contact you soon.</p>
    <a href="/home/" class="btn-home">⬅ Back to Home</a>
  </div>
<script src="/app-nav.js" defer></script>

</body>
</html>
