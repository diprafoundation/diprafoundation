<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Portal — DIPRA FOUNDATION</title>
  <style>
    :root {
      --primary: #0f2c52;
      --primary-hover: #163d70;
      --accent: #b8860b;
      --bg: #f4f7fb;
      --card-bg: #ffffff;
      --text: #1a2533;
      --text-muted: #64748b;
      --border: #d5e0ed;
      --success: #0f7a48;
      --error: #c0392b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }

    .portal-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 440px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(15, 44, 82, 0.12);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .header {
      background: linear-gradient(135deg, #0a1f3a, var(--primary));
      color: #ffffff;
      padding: 24px 20px;
      text-align: center;
    }
    .header h2 { font-size: 20px; margin-bottom: 4px; }
    .header p { font-size: 13px; color: #ffd894; }

    .tabs { display: flex; border-bottom: 1px solid var(--border); background: #f8fafc; }
    .tab-btn {
      flex: 1;
      padding: 12px;
      background: none;
      border: none;
      font-weight: 600;
      font-size: 14px;
      color: var(--text-muted);
      cursor: pointer;
      transition: 0.2s;
    }
    .tab-btn.active {
      color: var(--primary);
      border-bottom: 3px solid var(--primary);
      background: var(--card-bg);
    }

    .form-container { padding: 24px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: 0.2s;
    }
    .form-group input:focus, .form-group select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(15, 44, 82, 0.1); }

    .btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 8px;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn:disabled { background: var(--text-muted); cursor: not-allowed; }

    .link-btn {
      background: none;
      border: none;
      color: var(--primary);
      font-size: 12.5px;
      cursor: pointer;
      text-decoration: underline;
      margin-top: 10px;
      display: inline-block;
    }

    .alert {
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .alert-success { background: #e7f6ec; color: var(--success); border: 1px solid #b7e4c7; }
    .alert-error { background: #fdf0ed; color: var(--error); border: 1px solid #f8c4b8; }

    .form-step { display: none; }
    .form-step.active { display: block; }
  </style>
</head>
<body>

<div class="portal-card">
  <div class="header">
    <h2>The Uplift Portal</h2>
    <p>DIPRA FOUNDATION</p>
  </div>

  <div class="tabs" id="tabHeader">
    <button class="tab-btn active" onclick="switchTab('login')">Login</button>
    <button class="tab-btn" onclick="switchTab('register')">Register</button>
  </div>

  <div class="form-container">
    <div id="alertBox" class="alert"></div>

    <!-- 1. LOGIN FORM -->
    <form id="loginForm" class="form-step active" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Email ID</label>
        <input type="email" id="loginEmail" placeholder="aapka@email.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="******" required>
      </div>
      <button type="submit" class="btn" id="loginBtn">Sign In</button>
      <div style="text-align: right;">
        <button type="button" class="link-btn" onclick="switchTab('forgot')">Password bhool gaye?</button>
      </div>
    </form>

    <!-- 2. REGISTER FORM -->
    <form id="registerForm" class="form-step" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label>Poora Naam</label>
        <input type="text" id="regName" placeholder="Naam darj karein" required>
      </div>
      <div class="form-group">
        <label>Email ID</label>
        <input type="email" id="regEmail" placeholder="aapka@email.com" required>
      </div>
      <div class="form-group">
        <label>Mobile Number</label>
        <input type="tel" id="regMobile" pattern="[6-9][0-9]{9}" placeholder="10 anko ka mobile number" required>
      </div>
      <div class="form-group">
        <label>Role</label>
        <select id="regRole">
          <option value="Student">Student</option>
          <option value="Volunteer">Volunteer</option>
        </select>
      </div>
      <div class="form-group">
        <label>Password (Kam se kam 6 akshar)</label>
        <input type="password" id="regPassword" minlength="6" placeholder="******" required>
      </div>
      <button type="submit" class="btn" id="regBtn">Register Karein</button>
    </form>

    <!-- 3. FORGOT / RESET PASSWORD FORM -->
    <form id="forgotForm" class="form-step" onsubmit="handleForgot(event)">
      <div id="forgotStep1">
        <div class="form-group">
          <label>Registered Email ID</label>
          <input type="email" id="forgotEmail" placeholder="aapka@email.com" required>
        </div>
        <button type="submit" class="btn" id="forgotBtn">OTP Bhejein</button>
      </div>
      <div id="forgotStep2" style="display: none;">
        <div class="form-group">
          <label>Email Par Aaya OTP</label>
          <input type="text" id="resetOtp" placeholder="6 anko ka OTP" required>
        </div>
        <div class="form-group">
          <label>Naya Password</label>
          <input type="password" id="resetNewPass" minlength="6" placeholder="Naya password" required>
        </div>
        <button type="button" class="btn" onclick="handleResetPass()">Password Reset Karein</button>
      </div>
      <button type="button" class="link-btn" onclick="switchTab('login')">← Login Par Wapas Jayein</button>
    </form>
  </div>
</div>

<script>
  // ⚠️ APNE GOOGLE APPS SCRIPT WEB APP KA DEPLOYED URL YAHAN DALEIN
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbynC667snioVb9pnBE8jDRWUJHwKOUi5jTYO31PlfolDG5VjcTrE93zh2k-Ai7zgi0/exec';

  function switchTab(tab) {
    showAlert(''); // Clear alerts
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.form-step').forEach(f => f.classList.remove('active'));

    const tabHeader = document.getElementById('tabHeader');
    
    if (tab === 'login') {
      tabHeader.style.display = 'flex';
      tabHeader.children[0].classList.add('active');
      document.getElementById('loginForm').classList.add('active');
    } else if (tab === 'register') {
      tabHeader.style.display = 'flex';
      tabHeader.children[1].classList.add('active');
      document.getElementById('registerForm').classList.add('active');
    } else if (tab === 'forgot') {
      tabHeader.style.display = 'none'; // Hide tab header for forgot password
      document.getElementById('forgotForm').classList.add('active');
      document.getElementById('forgotStep1').style.display = 'block';
      document.getElementById('forgotStep2').style.display = 'none';
    }
  }

  function showAlert(msg, isSuccess = false) {
    const box = document.getElementById('alertBox');
    if (!msg) { box.style.display = 'none'; return; }
    box.className = 'alert ' + (isSuccess ? 'alert-success' : 'alert-error');
    box.innerText = msg;
    box.style.display = 'block';
  }

  async function sendApiRequest(payload) {
    const response = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    return await response.json();
  }

  // Handle Login
  async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.innerText = 'Wait karein...';
    showAlert('');

    try {
      const res = await sendApiRequest({
        action: 'loginUser',
        email: document.getElementById('loginEmail').value,
        password: document.getElementById('loginPassword').value
      });

      if (res.status === 'success') {
        showAlert('Login safal! Redirection ho raha hai...', true);
        localStorage.setItem('userToken', res.token);
        localStorage.setItem('userData', JSON.stringify(res.user));
        setTimeout(() => {
          window.location.href = 'dashboard.html'; // Aapke dashboard page ka URL
        }, 1200);
      } else {
        showAlert(res.message || 'Login mein samasya aayi.');
      }
    } catch (err) {
      showAlert('Server connection fail. Dobara koshish karein.');
    } finally {
      btn.disabled = false; btn.innerText = 'Sign In';
    }
  }

  // Handle Registration
  async function handleRegister(e) {
    e.preventDefault();
    const btn = document.getElementById('regBtn');
    btn.disabled = true; btn.innerText = 'Saving...';
    showAlert('');

    try {
      const res = await sendApiRequest({
        action: 'registerUser',
        name: document.getElementById('regName').value,
        email: document.getElementById('regEmail').value,
        mobile: document.getElementById('regMobile').value,
        role: document.getElementById('regRole').value,
        password: document.getElementById('regPassword').value
      });

      if (res.status === 'success') {
        showAlert(res.message, true);
        document.getElementById('registerForm').reset();
        setTimeout(() => switchTab('login'), 2000);
      } else {
        showAlert(res.message || 'Registration safal nahi hua.');
      }
    } catch (err) {
      showAlert('Server connection fail. Dobara koshish karein.');
    } finally {
      btn.disabled = false; btn.innerText = 'Register Karein';
    }
  }

  // Handle Forgot Password OTP Send
  async function handleForgot(e) {
    e.preventDefault();
    const btn = document.getElementById('forgotBtn');
    btn.disabled = true; btn.innerText = 'Sending OTP...';
    showAlert('');

    try {
      const res = await sendApiRequest({
        action: 'forgotPassword',
        email: document.getElementById('forgotEmail').value
      });

      if (res.status === 'success') {
        showAlert(res.message, true);
        document.getElementById('forgotStep1').style.display = 'none';
        document.getElementById('forgotStep2').style.display = 'block';
      } else {
        showAlert(res.message || 'OTP nahi bheja ja saka.');
      }
    } catch (err) {
      showAlert('Server connection fail.');
    } finally {
      btn.disabled = false; btn.innerText = 'OTP Bhejein';
    }
  }

  // Handle Reset Password with OTP
  async function handleResetPass() {
    showAlert('');
    try {
      const res = await sendApiRequest({
        action: 'resetPassword',
        email: document.getElementById('forgotEmail').value,
        otp: document.getElementById('resetOtp').value,
        newPassword: document.getElementById('resetNewPass').value
      });

      if (res.status === 'success') {
        showAlert(res.message, true);
        setTimeout(() => switchTab('login'), 2000);
      } else {
        showAlert(res.message || 'Password reset fail hua.');
      }
    } catch (err) {
      showAlert('Server connection fail.');
    }
  }
</script>
</body>
</html>
